name: rerun-slow-runners

# Benchmark jobs fail fast when their VM is below the calibration floor
# (see CALIB_MIN_* in bench.yml). Rerunning the failed jobs lands them on
# fresh runners. Capped at 5 attempts total to avoid loops on real bugs — a slow-VM
# rejection costs ~30s, and three consecutive lemons for one job is an
# every-few-days event at the observed lemon rate.

on:
  workflow_run:
    workflows: [fs-bench]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.run_attempt < 5
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed benchmark jobs on fresh runners
        run: |
          count=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/attempts/${{ github.event.workflow_run.run_attempt }}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("bench (")) | select(.conclusion == "failure" or .conclusion == "timed_out")] | length')
          if [ "$count" = 0 ]; then
            echo "no failed benchmark jobs in this attempt; not retrying publisher failures"
            exit 0
          fi

          current=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" \
            --jq '[.status, .run_attempt] | @tsv')
          expected=$'completed\t${{ github.event.workflow_run.run_attempt }}'
          if [ "$current" != "$expected" ]; then
            echo "workflow advanced to $current; ignoring stale attempt $expected"
            exit 0
          fi

          gh api -X POST \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
        env:
          GH_TOKEN: ${{ github.token }}

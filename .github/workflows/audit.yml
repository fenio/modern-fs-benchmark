name: results-audit

# Daily sanity scan of the accumulated results history: impossible
# orderings, self-healing failures, ENOSPC regressions, unexpected nulls
# (hard = red run), plus variance/flapping warnings in the job summary.

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fetch results history
        run: |
          git fetch origin results-data
          git worktree add data origin/results-data

      - name: Audit results
        run: |
          set -o pipefail
          python3 scripts/audit-results.py data/runs | tee -a "$GITHUB_STEP_SUMMARY"

  audit-sas-hdd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fetch sas-hdd result history
        id: history
        run: |
          set +e
          git ls-remote --exit-code --heads origin results-real-hw-sas-hdd >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin results-real-hw-sas-hdd
            git worktree add sas-hdd-data origin/results-real-hw-sas-hdd
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo "failed to query results-real-hw-sas-hdd (git exit $status)" >&2
            exit "$status"
          fi

      - name: Audit sas-hdd results
        if: steps.history.outputs.present == 'true'
        run: |
          set -o pipefail
          python3 scripts/audit-results.py sas-hdd-data/runs \
            --expected-hardware-profile sas-hdd | tee -a "$GITHUB_STEP_SUMMARY"

  audit-sas-hdd-hybrid-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fetch hybrid-tier result history
        id: history
        run: |
          branch=results-real-hw-sas-hdd-hybrid-tier-v1
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin "$branch"
            git worktree add hybrid-tier-data "origin/$branch"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo "failed to query $branch (git exit $status)" >&2
            exit "$status"
          fi

      - name: Audit hybrid-tier results
        if: steps.history.outputs.present == 'true'
        run: |
          set -o pipefail
          python3 scripts/audit-results.py hybrid-tier-data/runs \
            --expected-hardware-profile sas-hdd \
            --expected-benchmark-scenario hybrid-tier-v1 \
            --expected-configuration btrfs/hybrid-dmcache \
            --expected-configuration zfs/hybrid-special-l2arc \
            --expected-configuration bcachefs/hybrid-native \
            | tee -a "$GITHUB_STEP_SUMMARY"

name: publish-pages

on:
  workflow_run:
    workflows: [fs-bench, fs-bench-real-hw, fs-bench-real-hw-sas-hdd, fs-bench-real-hw-sas-hdd-hybrid-tier, fs-bench-real-hw-sas-hdd-hybrid-tier-v2, fs-bench-real-hw-sas-hdd-three-copy]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check out hosted result history
        run: |
          git fetch origin results-data
          git worktree add standard-data origin/results-data

      - name: Check out hardware result history
        run: |
          set +e
          git ls-remote --exit-code --heads origin results-real-hw >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin results-real-hw
            git worktree add hardware-data origin/results-real-hw
          elif [ "$status" -eq 2 ]; then
            mkdir -p hardware-data/runs
          else
            echo "failed to query results-real-hw (git exit $status)" >&2
            exit "$status"
          fi

      - name: Check out sas-hdd result history
        id: sas-hdd-history
        run: |
          set +e
          git ls-remote --exit-code --heads origin results-real-hw-sas-hdd >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin results-real-hw-sas-hdd
            git worktree add sas-hdd-data origin/results-real-hw-sas-hdd
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo "failed to query results-real-hw-sas-hdd (git exit $status)" >&2
            exit "$status"
          fi

      - name: Build dashboards
        run: |
          python3 scripts/make-dashboard.py --runs standard-data/runs --out site/index.html \
            --repo "https://github.com/${{ github.repository }}" \
            --run-cadence '6-hourly cron + every push' \
            --dashboard-link 'Real hardware (farm3)=real-hw/' \
            --dashboard-link 'SAS HDD=sas-hdd/' \
            --dashboard-link 'Hybrid tier v1=sas-hdd/hybrid-tier/' \
            --dashboard-link 'Hybrid tier v2=sas-hdd/hybrid-tier-v2/' \
            --dashboard-link 'Three-copy failures=sas-hdd/three-copy/' \
            --setup-detail 'Environment=GitHub-hosted Ubuntu VM; each filesystem configuration runs in a fresh VM' \
            --setup-detail 'Devices=Four 16 GiB loop devices plus one 16 GiB rebuild spare; the ZFS-single job uses one 32 GiB loop device' \
            --setup-detail 'Storage caveat=Loop-device files share the VM ephemeral backing storage; they are not independent physical disks' \
            --setup-detail 'Mirrored layouts=Linux md/LVM RAID10, two striped ZFS mirror pairs, Btrfs RAID1, or bcachefs replicas=2 across four loop devices' \
            --setup-detail 'Parity layouts=Linux md RAID6, XFS on md RAID5/6 over per-member dm-integrity, ZFS RAIDZ1/RAIDZ2, Btrfs RAID6 with RAID1C3 metadata, or bcachefs erasure coding across four loop devices' \
            --setup-detail 'Single-device layouts=Use one loop device'
          if compgen -G "hardware-data/runs/*/result-*.json" >/dev/null; then
            python3 scripts/make-dashboard.py --runs hardware-data/runs --out site/real-hw/index.html \
              --repo "https://github.com/${{ github.repository }}" \
              --hardware-profile farm3 --expected-hardware-profile farm3 \
              --allow-missing-hardware-profile --history-branch results-real-hw \
              --dashboard-link 'Hosted CI=../' \
              --dashboard-link 'SAS HDD=../sas-hdd/' \
              --dashboard-link 'Hybrid tier v1=../sas-hdd/hybrid-tier/' \
              --dashboard-link 'Hybrid tier v2=../sas-hdd/hybrid-tier-v2/' \
              --dashboard-link 'Three-copy failures=../sas-hdd/three-copy/'
          fi

      - name: Build sas-hdd dashboard
        if: steps.sas-hdd-history.outputs.present == 'true'
        run: |
          if compgen -G "sas-hdd-data/runs/*/result-*.json" >/dev/null; then
            python3 scripts/make-dashboard.py --runs sas-hdd-data/runs \
              --out site/sas-hdd/index.html \
              --repo "https://github.com/${{ github.repository }}" \
              --hardware-profile sas-hdd --expected-hardware-profile sas-hdd \
              --history-branch results-real-hw-sas-hdd \
              --dashboard-link 'Hosted CI=../' \
              --dashboard-link 'Real hardware (farm3)=../real-hw/' \
              --dashboard-link 'Hybrid tier v1=hybrid-tier/' \
              --dashboard-link 'Hybrid tier v2=hybrid-tier-v2/' \
              --dashboard-link 'Three-copy failures=three-copy/' \
              --setup-detail 'Host=Intel Xeon E5-2640 v4 (20 threads), 251 GiB RAM, LSI SAS3008 controller' \
              --setup-detail 'Physical media=Six independent 6 TB 7200 RPM SAS HDDs: four 16 GiB member partitions, one 16 GiB rebuild spare, and one dedicated 32 GiB ZFS-single partition' \
              --setup-detail 'Mirrored layouts=Linux md/LVM RAID10, two striped ZFS mirror pairs, Btrfs RAID1, or bcachefs replicas=2 across four member disks' \
              --setup-detail 'Parity layouts=Linux md RAID6, XFS on md RAID5/6 over per-member dm-integrity, ZFS RAIDZ1/RAIDZ2, Btrfs RAID6 with RAID1C3 metadata, or bcachefs erasure coding across four member disks' \
              --setup-detail 'Single-device layouts=Use one member disk; ZFS single uses the separate 32 GiB disk'
          fi

      - name: Check out hybrid-tier result history
        id: hybrid-tier-history
        run: |
          branch=results-real-hw-sas-hdd-hybrid-tier-v1
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin "$branch"
            git worktree add hybrid-tier-data "origin/$branch"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo "failed to query $branch (git exit $status)" >&2
            exit "$status"
          fi

      - name: Build hybrid-tier dashboard
        if: steps.hybrid-tier-history.outputs.present == 'true'
        run: |
          if compgen -G "hybrid-tier-data/runs/*/result-*.json" >/dev/null; then
            python3 scripts/make-dashboard.py --runs hybrid-tier-data/runs \
              --out site/sas-hdd/hybrid-tier/index.html \
              --repo "https://github.com/${{ github.repository }}" \
              --hardware-profile sas-hdd --expected-hardware-profile sas-hdd \
              --expected-benchmark-scenario hybrid-tier-v1 \
              --history-branch results-real-hw-sas-hdd-hybrid-tier-v1 \
              --dashboard-link 'Hosted CI=../../' \
              --dashboard-link 'Real hardware (farm3)=../../real-hw/' \
              --dashboard-link 'SAS HDD baseline=../' \
              --dashboard-link 'Hybrid tier v2=../hybrid-tier-v2/' \
              --dashboard-link 'Three-copy failures=../three-copy/' \
              --setup-detail 'Host=Intel Xeon E5-2640 v4 (20 threads), 251 GiB RAM, LSI SAS3008 controller' \
              --setup-detail 'Physical media=Eleven drives: eight SAS HDDs and three SAS SSDs' \
              --setup-detail 'Allocation=Eight 128 GiB HDD data partitions; two SSDs each provide 64 GiB durable data plus 4 GiB cache metadata; the third SSD provides a 64 GiB disposable read cache' \
              --setup-detail 'Role use=Btrfs uses the 4 GiB cache-metadata partitions but not the third SSD; ZFS and bcachefs use the third SSD but not those metadata partitions' \
              --setup-detail 'Btrfs=Single-profile Btrfs on eight-HDD md RAID10 with mirrored SSD LVM dm-cache in writeback mode' \
              --setup-detail 'ZFS=Four HDD mirror vdevs, a mirrored SSD metadata-only special vdev, and SSD L2ARC' \
              --setup-detail 'bcachefs=Replicated HDD background target, mirrored SSD foreground and metadata targets, and a non-durable SSD promote target'
          fi

      - name: Check out hybrid-tier-v2 result history
        id: hybrid-tier-v2-history
        run: |
          branch=results-real-hw-sas-hdd-hybrid-tier-v2
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin "$branch"
            git worktree add hybrid-tier-v2-data "origin/$branch"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo "failed to query $branch (git exit $status)" >&2
            exit "$status"
          fi

      - name: Build hybrid-tier-v2 dashboard
        if: steps.hybrid-tier-v2-history.outputs.present == 'true'
        run: |
          if compgen -G "hybrid-tier-v2-data/runs/*/result-*.json" >/dev/null; then
            python3 scripts/make-dashboard.py --runs hybrid-tier-v2-data/runs \
              --out site/sas-hdd/hybrid-tier-v2/index.html \
              --repo "https://github.com/${{ github.repository }}" \
              --hardware-profile sas-hdd --expected-hardware-profile sas-hdd \
              --expected-benchmark-scenario hybrid-tier-v2 \
              --history-branch results-real-hw-sas-hdd-hybrid-tier-v2 \
              --dashboard-link 'Hosted CI=../../' \
              --dashboard-link 'Real hardware (farm3)=../../real-hw/' \
              --dashboard-link 'SAS HDD baseline=../' \
              --dashboard-link 'Hybrid tier v1=../hybrid-tier/' \
              --dashboard-link 'Three-copy failures=../three-copy/' \
              --setup-detail 'Host=Intel Xeon E5-2640 v4 (20 threads), 251 GiB RAM, LSI SAS3008 controller' \
              --setup-detail 'Physical media=Eleven drives: eight SAS HDDs and three SAS SSDs' \
              --setup-detail 'Allocation=Eight 128 GiB HDD data partitions; all three SSDs provide 64 GiB data partitions, while the first two also retain 4 GiB dm-cache metadata partitions for Btrfs' \
              --setup-detail 'Role use=Btrfs is unchanged and uses two SSDs plus their cache-metadata partitions; ZFS is unchanged and uses two SSDs as a special vdev plus the third as L2ARC; bcachefs uses all three SSDs as one durable hot target' \
              --setup-detail 'Btrfs=Single-profile Btrfs on eight-HDD md RAID10 with mirrored SSD LVM dm-cache in writeback mode' \
              --setup-detail 'ZFS=Four HDD mirror vdevs, a mirrored SSD metadata-only special vdev, and SSD L2ARC' \
              --setup-detail 'bcachefs=Replicated HDD background target and a three-SSD foreground, metadata, and promotion target; whole-extent promotion is disabled'
          fi

      - name: Check out three-copy result history
        id: three-copy-history
        run: |
          branch=results-real-hw-sas-hdd-three-copy-v1
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin "$branch"
            git worktree add three-copy-data "origin/$branch"
            echo 'present=true' >> "$GITHUB_OUTPUT"
            if compgen -G "three-copy-data/runs/*/result-*.json" >/dev/null; then
              echo 'has-results=true' >> "$GITHUB_OUTPUT"
            else
              echo 'has-results=false' >> "$GITHUB_OUTPUT"
            fi
          elif [ "$status" -eq 2 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'has-results=false' >> "$GITHUB_OUTPUT"
          else
            echo "failed to query $branch (git exit $status)" >&2
            exit "$status"
          fi

      - name: Build three-copy dashboard
        if: steps.three-copy-history.outputs.has-results == 'true'
        run: |
          if compgen -G "three-copy-data/runs/*/result-*.json" >/dev/null; then
            python3 scripts/make-dashboard.py --runs three-copy-data/runs \
              --out site/sas-hdd/three-copy/index.html \
              --repo "https://github.com/${{ github.repository }}" \
              --hardware-profile sas-hdd --expected-hardware-profile sas-hdd \
              --expected-benchmark-scenario three-copy-v1 \
              --history-branch results-real-hw-sas-hdd-three-copy-v1 \
              --dashboard-link 'Hosted CI=../../' \
              --dashboard-link 'Real hardware (farm3)=../../real-hw/' \
              --dashboard-link 'SAS HDD baseline=../' \
              --dashboard-link 'Hybrid tier v1=../hybrid-tier/' \
              --dashboard-link 'Hybrid tier v2=../hybrid-tier-v2/' \
              --setup-detail 'Host=Intel Xeon E5-2640 v4 (20 threads), 251 GiB RAM, LSI SAS3008 controller and shared SAS expander' \
              --setup-detail 'Physical media=Five independent 6 TB SAS HDDs: three 16 GiB members and two 16 GiB replacement spares' \
              --setup-detail 'Three-copy layouts=Ext4 and XFS on three-member md RAID1, Btrfs RAID1C3, one three-way ZFS mirror, and bcachefs replicas=3' \
              --setup-detail 'Control=Btrfs RAID1 uses two copies distributed over three devices and is expected to tolerate only one arbitrary member loss' \
              --setup-detail 'Fault method=Each partition is exposed through dm-linear; selected mappings are atomically reloaded with the dm-error target to return hard I/O errors' \
              --setup-detail 'Scope=Drive-level failures only; the shared controller and expander are not independent failure domains'
          fi

      - name: Build three-copy placeholder
        if: steps.three-copy-history.outputs.has-results != 'true'
        run: |
          mkdir -p site/sas-hdd/three-copy
          printf '%s\n' \
            '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three-copy failure campaign</title><style>body{font:16px/1.55 system-ui;max-width:720px;margin:12vh auto;padding:0 24px;color:#171717}a{color:inherit}h1{font-size:28px}</style><h1>Three-copy failure campaign</h1><p>The scenario is ready, but no validated hardware run has been published yet.</p><p><a href="https://github.com/${{ github.repository }}/blob/main/docs/sas-hdd-three-copy.md">Read the methodology</a> or <a href="../">return to the SAS HDD dashboard</a>.</p></html>' \
            > site/sas-hdd/three-copy/index.html

      - uses: actions/configure-pages@v6

      - name: Drop stale pages artifacts from earlier attempts
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
                        --jq '.artifacts[] | select(.name == "github-pages") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
